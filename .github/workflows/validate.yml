name: Validate CSV

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check numbers and empty fields
        shell: python
        run: |
          import csv, sys
          from collections import Counter

          with open("data.csv", encoding="utf-8") as f:
              reader = csv.DictReader(f)
              header = reader.fieldnames
              rows = list(reader)

          errors = []

          for line, row in enumerate(rows, start=2):
              if None in row or len(row) != len(header):
                  errors.append(f"line {line}: expected {len(header)} columns")
              for col, val in row.items():
                  if col is not None and not (val or "").strip():
                      errors.append(f"line {line}: empty {col}")

          numbers = Counter(r["number"] for r in rows)
          for n, count in numbers.items():
              if count > 1:
                  errors.append(f"number {n} appears {count} times")
          expected = {str(i) for i in range(1, 101)}
          for n in sorted(expected - numbers.keys(), key=int):
              errors.append(f"number {n} is missing")
          for n in sorted(numbers.keys() - expected):
              errors.append(f"number {n!r} is out of range 1-100")

          colors = Counter((r["color"], r["color_num"]) for r in rows)
          for (color, num), count in colors.items():
              if count > 1:
                  errors.append(f"color {color} {num} appears {count} times")

          for e in errors:
              print(f"::error file=data.csv::{e}")
          if errors:
              sys.exit(1)
          print(f"OK: {len(rows)} rows")
